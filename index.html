<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<img id="image" src="" alt="Aucune image">

<script>
  grist.ready();

  grist.onRecord(function(record) {
    const img = document.getElementById("image");

    if (!record || !record["Photo"] || record["Photo"].length === 0) {
      img.src = "";
      return;
    }

    const file = record["Photo"][0];

    // construction manuelle URL
    img.src = `/attachments/${file.id}`;
  });
</script>

</body>
</html>
